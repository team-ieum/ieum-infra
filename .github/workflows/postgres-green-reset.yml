name: Deploy DEV Shared PostgreSQL

on:
  workflow_dispatch:

permissions:
  contents: read

# Shared data services serialize with each other; the helper also holds the app deploy lock.
concurrency:
  group: infra_dev_shared_services
  cancel-in-progress: false

jobs:
  deploy-postgres:
    name: Preserve volumes and update PostgreSQL
    timeout-minutes: 30
    runs-on:
      group: ieum_dev_server
      labels: [self-hosted, linux, x64, ieum-infra]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test infrastructure configuration
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/dev -p 'test_*.py'

      - name: Deploy existing shared PostgreSQL from DEV_COM Secrets
        env:
          IEUM_INFRA_SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          # Existing data network/container/project/volumes must already match.
          # No reset, volume removal, network creation or automatic network migration.
          python3 scripts/dev/infra_env.py --service postgres --deploy
