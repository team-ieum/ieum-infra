name: Blue Green Hosted Test (Temporary)

on:
  push:
    branches: ['infra/IEUM-SRV-28']

permissions:
  contents: read

concurrency:
  group: bluegreen-hosted-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test blue-green controller and routing
        run: python3 -m unittest discover -s bluegreen -p 'test_*.py'

      - name: Test shared service configuration
        run: python3 -m unittest discover -s scripts/dev -p 'test_*.py'
