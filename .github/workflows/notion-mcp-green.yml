name: Deploy Green Notion MCP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy_green_notion_mcp
  cancel-in-progress: false

env:
  COMPOSE_FILE: compose/notion-mcp.green.compose.yml
  ENV_FILE: ${{ secrets.NOTION_MCP_ENV_FILE }}

  NOTION_MCP_CONTAINER_NAME: ${{ secrets.NOTION_MCP_CONTAINER_NAME }}
  NOTION_MCP_PORT: ${{ secrets.NOTION_MCP_PORT }}

  GREEN_NETWORK: ${{ secrets.GREEN_NETWORK }}
  GREEN_NETWORK_SUBNET: ${{ secrets.GREEN_NETWORK_SUBNET }}

jobs:
  deploy-notion-mcp:
    name: Deploy Notion MCP Container
    runs-on:
      group: ieum_dev_server
      labels: [self-hosted, linux, x64, ieum-infra]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure env directory exists
        run: |
          mkdir -p "$(dirname "$ENV_FILE")"

      - name: Create env file from GitHub Secrets
        run: |
          printf "%s\n" \
            "NOTION_MCP_CONTAINER_NAME=${NOTION_MCP_CONTAINER_NAME}" \
            "NOTION_MCP_PORT=${NOTION_MCP_PORT}" \
            "GREEN_NETWORK=${GREEN_NETWORK}" \
            "GREEN_NETWORK_SUBNET=${GREEN_NETWORK_SUBNET}" \
            > "$ENV_FILE"

      - name: Ensure Docker network
        run: |
          docker network inspect "$GREEN_NETWORK" >/dev/null 2>&1 \
            || docker network create \
                 --subnet "$GREEN_NETWORK_SUBNET" \
                 "$GREEN_NETWORK"

      - name: Deploy Notion MCP
        run: |
          docker compose \
            -f "$COMPOSE_FILE" \
            --env-file "$ENV_FILE" \
            down --remove-orphans

          docker rm -f "$NOTION_MCP_CONTAINER_NAME" >/dev/null 2>&1 || true

          docker compose \
            -f "$COMPOSE_FILE" \
            --env-file "$ENV_FILE" \
            up -d --build

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Running}}' "$NOTION_MCP_CONTAINER_NAME" 2>/dev/null)" = "true" ]; then
              exit 0
            fi
            sleep 2
          done

          docker logs --tail 100 "$NOTION_MCP_CONTAINER_NAME"
          exit 1
