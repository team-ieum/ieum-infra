name: Deploy DEV Shared Phoenix

on:
  workflow_dispatch:

permissions:
  contents: read

# Shared data services serialize with each other; the helper also holds the app deploy lock.
concurrency:
  group: infra_dev_shared_services
  cancel-in-progress: false

jobs:
  deploy-phoenix:
    name: Preserve volumes and update Phoenix
    timeout-minutes: 30
    runs-on:
      group: ieum_dev_server
      labels: [self-hosted, linux, x64, ieum-infra]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test infrastructure configuration
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/dev -p 'test_*.py'

      - name: Deploy existing shared Phoenix from DEV_COM Secrets
        env:
          DEV_COM_DATA_DOCKER_NETWORK: ${{ secrets.DEV_COM_DATA_DOCKER_NETWORK }}
          DEV_COM_DATA_DOCKER_NETWORK_SUBNET: ${{ secrets.DEV_COM_DATA_DOCKER_NETWORK_SUBNET }}
          DEV_COM_HOST_BIND_IP: ${{ secrets.DEV_COM_HOST_BIND_IP }}
          DEV_COM_PHOENIX_ENV_FILE: ${{ secrets.DEV_COM_PHOENIX_ENV_FILE }}
          DEV_COM_PHOENIX_CONTAINER_NAME: ${{ secrets.DEV_COM_PHOENIX_CONTAINER_NAME }}
          DEV_COM_PHOENIX_UI_PORT: ${{ secrets.DEV_COM_PHOENIX_UI_PORT }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          # Existing data network/container/project/volumes must already match.
          # No reset, volume removal, network creation or automatic network migration.
          python3 scripts/dev/infra_env.py --service phoenix --deploy
