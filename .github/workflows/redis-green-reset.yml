name: Reset Green Redis

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reset_green_redis
  cancel-in-progress: false

env:
  COMPOSE_FILE: compose/redis.green.yml
  ENV_FILE: ${{ secrets.REDIS_ENV_FILE }}

  REDIS_CONTAINER_NAME: ${{ secrets.REDIS_CONTAINER_NAME }}
  REDIS_IP: ${{ secrets.REDIS_IP }}

  GREEN_NETWORK: ${{ secrets.GREEN_NETWORK }}
  GREEN_NETWORK_SUBNET: ${{ secrets.GREEN_NETWORK_SUBNET }}

jobs:
  reset-redis:
    name: Reset Redis Container
    runs-on:
      group: ieum_dev_server
      labels: [self-hosted, linux, x64, ieum-infra]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure env directory exists
        run: |
          mkdir -p "$(dirname "$ENV_FILE")"

      - name: Create env file from GitHub Secrets
        run: |
          printf "%s\n" \
            "REDIS_CONTAINER_NAME=${REDIS_CONTAINER_NAME}" \
            "REDIS_IP=${REDIS_IP}" \
            "GREEN_NETWORK=${GREEN_NETWORK}" \
            "GREEN_NETWORK_SUBNET=${GREEN_NETWORK_SUBNET}" \
            > "$ENV_FILE"

      - name: Ensure Docker network
        run: |
          docker network inspect "$GREEN_NETWORK" >/dev/null 2>&1 \
            || docker network create \
                 --subnet "$GREEN_NETWORK_SUBNET" \
                 "$GREEN_NETWORK"

      - name: Reset Redis
        run: |
          docker compose \
            -f "$COMPOSE_FILE" \
            --env-file "$ENV_FILE" \
            down -v --remove-orphans

          docker rm -f "$REDIS_CONTAINER_NAME" >/dev/null 2>&1 || true

          docker compose \
            -f "$COMPOSE_FILE" \
            --env-file "$ENV_FILE" \
            up -d

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if docker exec "$REDIS_CONTAINER_NAME" redis-cli ping | grep -q PONG; then
              exit 0
            fi
            sleep 2
          done

          docker logs --tail 100 "$REDIS_CONTAINER_NAME"
          exit 1