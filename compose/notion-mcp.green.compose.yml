name: ieum-green-notion-mcp

services:
  notion-mcp:
    build:
      context: .
      dockerfile: notion-mcp.Dockerfile
    image: ieum-notion-mcp:green
    container_name: ${NOTION_MCP_CONTAINER_NAME}
    restart: unless-stopped

    # 게이트웨이 Bearer 인증 토큰. ieum-agent가 Authorization: Bearer로 동일 값을 보낸다.
    # (docker inspect Args 노출을 피하려 --auth-token 플래그 대신 env로 주입)
    environment:
      AUTH_TOKEN: ${NOTION_MCP_AUTH_TOKEN}

    command:
      - "--transport"
      - "http"
      # 기본 바인딩이 127.0.0.1이라 컨테이너 내부에서만 접근된다. 같은 네트워크의
      # 다른 컨테이너(ieum-agent)가 닿을 수 있도록 0.0.0.0(모든 인터페이스)에 바인딩한다.
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "${NOTION_MCP_PORT}"
      - "--enable-token-passthrough"

    # AWS 배포 서버에서는 agent EC2가 infra EC2의 private IP로 접근하므로 host port를 연다.
    # 기본 bind를 localhost로 두어 기존 개발 서버 reset workflow의 노출 범위는 유지한다.
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${NOTION_MCP_HOST_PORT:-3000}:${NOTION_MCP_PORT}"

    # 고정 IP를 박지 않는다. ieum-agent는 컨테이너명(Docker 내장 DNS)으로 접근하므로
    # 고정 IP가 불필요하고, 대역 내 주소 충돌(Address already in use)도 피한다.
    networks:
      - green_network

networks:
  green_network:
    external: true
    name: ${GREEN_NETWORK}
