name: ieum-green-notion-mcp

services:
  notion-mcp:
    build:
      context: .
      dockerfile: notion-mcp.Dockerfile
    image: ieum-notion-mcp:green
    container_name: ${NOTION_MCP_CONTAINER_NAME}
    restart: unless-stopped

    command:
      - "--transport"
      - "http"
      # 기본 바인딩이 127.0.0.1이라 컨테이너 내부에서만 접근된다. 같은 네트워크의
      # 다른 컨테이너(ieum-agent)가 닿을 수 있도록 0.0.0.0(모든 인터페이스)에 바인딩한다.
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "${NOTION_MCP_PORT}"
      - "--enable-token-passthrough"

    # 토큰 passthrough 서버이므로 호스트로 포트를 노출하지 않는다.
    # 같은 green_network에 있는 ieum-agent만 컨테이너명/IP로 접근한다.
    expose:
      - "${NOTION_MCP_PORT}"

    # 고정 IP를 박지 않는다. ieum-agent는 컨테이너명(Docker 내장 DNS)으로 접근하므로
    # 고정 IP가 불필요하고, 대역 내 주소 충돌(Address already in use)도 피한다.
    networks:
      - green_network

networks:
  green_network:
    external: true
    name: ${GREEN_NETWORK}
