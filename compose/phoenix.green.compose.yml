name: ieum-green-phoenix

services:
  phoenix:
    image: arizephoenix/phoenix:19.6.0
    container_name: ${PHOENIX_CONTAINER_NAME}
    restart: unless-stopped

    # 트레이스를 SQLite로 볼륨에 영속화(재시작 후 유지). Phoenix는 PHOENIX_WORKING_DIR
    # 하위에 DB를 만든다.
    environment:
      PHOENIX_WORKING_DIR: /mnt/data

    volumes:
      - ieum_phoenix_data:/mnt/data

    # UI(6006)를 호스트로 노출한다. 같은 6006 포트가 OTLP HTTP 수신(/v1/traces)도 겸한다.
    # ieum-agent는 green_network 안에서 컨테이너명으로, 호스트 뷰어는 이 포트로 접근.
    ports:
      - "${PHOENIX_UI_PORT}:6006"

    # 고정 IP를 박지 않는다. ieum-agent는 컨테이너명(Docker 내장 DNS)으로 접근한다.
    networks:
      - green_network

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6006')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  green_network:
    external: true
    name: ${GREEN_NETWORK}

volumes:
  ieum_phoenix_data:
